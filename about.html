<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - définitif investments</title>
  <link rel="stylesheet" href="style.css">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>

<body>

  <!-- Header (same as home) -->
  <header id="header"></header>

  <!-- Banner -->
  <div class="banner">
    <h1>About Us</h1>
  </div>

  <!-- About Content -->
  <div class="container">
    <section>
      <h2>Who We Are</h2>
      <p>définitif investments is committed to clarity, security, and growth for our clients.</p>
    </section>

    <section>
      <h2>Our Mission</h2>
      <p>We aim to simplify investments and empower individuals with transparent solutions.</p>
    </section>
  </div>

  <!-- Footer (same as home) -->
  <footer id="footer"></footer>

</body>
</html>
