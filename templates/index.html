<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>définitif investments</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <img src="{{ url_for('static', filename='definitif_Logo_wb_with_red_hl_square.png') }}" alt="Logo">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;

    // Attach toggle logic AFTER header loads
    if (id === "header") {
      const menuToggle = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      const overlay = document.querySelector('.overlay');

      if (menuToggle && navLinks && overlay) {
        menuToggle.addEventListener('click', () => {
          navLinks.classList.toggle('active');
          overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
          navLinks.classList.remove('active');
          overlay.classList.remove('active');
        });
      }
    }
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>

<body>

  <!-- Header -->
  <!-- {% include 'header.html' %} -->
  <header id="header"></header>

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Banner-home Section -->
  <div class="banner-home">
    <h1>
      <span>Clarity</span>
      <span class="red-dots">•</span>
      <span>Security</span>
      <span class="red-dots">•</span>
      <span>Growth</span>
    </h1>
  </div>


  <!-- Horizontal Sections -->
  <div class="horizontal-sections">
    <section id="insights" class="container">
      <h2>Partners</h2>
      <p>Name of the Partners like MFU, Investwell.</p>
      <img src="https://picsum.photos/300/200?random=1" alt="Random placeholder image">
    </section>

    <section id="about" class="container">
      <h2>Something</h2>
      <p>Brief description about your company or project.</p>
      <img src="https://picsum.photos/300/200?random=2" alt="Random placeholder image">
    </section>

    <section class="container">
      <h2>Calculators</h2>
      <p>Paln your investments.</p>
      <img src="https://picsum.photos/300/200?random=3" alt="Random placeholder image">
    </section>
  </div>

  <!-- Footer -->
  <!-- {% include 'footer.html' %} -->
  <footer id="footer"></footer>

  <!-- JavaScript -->
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    const overlay = document.querySelector('.overlay');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');   // slide menu
      overlay.classList.toggle('active');    // show overlay
    });

    overlay.addEventListener('click', () => {
      navLinks.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
