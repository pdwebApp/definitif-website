<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculators - définitif</title>
  <link rel="icon" type="image/png" href="definitif_Logo_wb_with_red_hl_square.png">
  <link rel="stylesheet" href="style.css">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;

    // Attach toggle logic AFTER header loads
    if (id === "header") {
      const menuToggle = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      const overlay = document.querySelector('.overlay');

      if (menuToggle && navLinks && overlay) {
        menuToggle.addEventListener('click', () => {
          navLinks.classList.toggle('active');
          overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
          navLinks.classList.remove('active');
          overlay.classList.remove('active');
        });
      }
    }
  }
loadComponent("header", "header.html");
loadComponent("footer", "footer.html");
</script>

<body>
  <!-- Common header injected -->
  <header id="header"></header>

  <main class="container">
  <h2>Choose a Calculator</h2>
  <div class="calc-grid">
    <!-- Investment Growth Card -->
    <div class="calc-card">
      <div class="card-image" style="background-image: url('https://picsum.photos/600/400?random=10');">
        <div class="card-overlay">
          <h3>Investment Growth</h3>
          <p>Estimate how your investments grow over time with SIPs and lumpsum contributions.</p>
          <a href="/investment" class="btn">Open Calculator</a>
        </div>
      </div>
    </div>

    <!-- Retirement Calculator Card -->
    <div class="calc-card">
      <div class="card-image" style="background-image: url('https://picsum.photos/600/400?random=11');">
        <div class="card-overlay">
          <h3>Retirement</h3>
          <p>Plan your retirement corpus based on expenses, inflation, and expected returns.</p>
          <a href="/retirement" class="btn">Open Calculator</a>
        </div>
      </div>
    </div>
  </div>
</main>

  <!-- Common footer injected -->
  <footer id="footer"></footer>
</body>
</html>
