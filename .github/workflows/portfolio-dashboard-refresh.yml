name: Portfolio Dashboard Refresh

on:
  workflow_run:
    workflows: ["AMFI NAV Pipeline"]
    types:
      - completed

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show executed code
        run: |
          nl -ba generate_portfolio_json.py | sed -n '120,145p'

      - name: Generate portfolio JSON files
        run: |
          python generate_portfolio_json.py

      - name: Debug generated output
        run: |
          ls -la output/users || true
          echo "----"
          python - <<'PY'
          import os
          path = "output/users/users_index.json"
          print("exists:", os.path.exists(path))
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  print(f.read()[:1000])
          PY

      - name: Debug environment
        run: |
          echo "Python version: $(python --version)"
          echo "WORKSPACE: $GITHUB_WORKSPACE"
          echo "CWD: $(pwd)"

          echo "SUPABASE_URL set? ${SUPABASE_URL:+yes}"
          echo "SUPABASE_DB_URL set? ${SUPABASE_DB_URL:+yes}"
          echo "SUPABASE_SERVICE_ROLE_KEY set? ${SUPABASE_SERVICE_ROLE_KEY:+yes}"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"

      - name: Print environment
        run: env | sort

      - name: Show required vars
        run: |
          for v in SUPABASE_URL SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!v}" ]; then
              echo "$v is set"
            else
              echo "$v is missing"
            fi
          done

      - name: Upload JSONs to Supabase Storage
        run: |
          python scripts/upload_portfolios.py