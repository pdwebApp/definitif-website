name: AMFI NAV Pipeline

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  rta-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_amfiPipe.txt

      - name: Run RTA Pipeline
        run: python scripts/rtaData_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_KD: ${{ secrets.EMAIL_KD }}
          EMAIL_KD_PASS: ${{ secrets.EMAIL_KD_PASS }}

  nav-job:
    runs-on: ubuntu-latest
    needs: rta-pipeline
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_amfiPipe.txt

      - name: Run NAV Job
        run: python scripts/amfi_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}