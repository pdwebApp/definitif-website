name: AMFI NAV Pipeline

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  rta-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_amfiPipe.txt

      - name: Check email secret injection
        env:
          EMAIL_KD: ${{ secrets.EMAIL_KD }}
          EMAIL_KD_PASS: ${{ secrets.EMAIL_KD_PASS }}
        run: |
          python - <<'PY'
          import os

          user = os.environ.get("EMAIL_KD", "")
          password = os.environ.get("EMAIL_KD_PASS", "")

          print("EMAIL_KD present:", bool(user))
          print("EMAIL_KD length:", len(user))
          print("EMAIL_KD contains @:", "@" in user)

          print("EMAIL_KD_PASS present:", bool(password))
          print("EMAIL_KD_PASS length:", len(password))
          print("EMAIL_KD_PASS has whitespace:", any(c.isspace() for c in password))
          print("EMAIL_KD_PASS starts with quote:", password.startswith(("'", '"')))
          print("EMAIL_KD_PASS ends with quote:", password.endswith(("'", '"')))
          PY

      - name: Run RTA Pipeline
        env:
          EMAIL_KD: ${{ secrets.EMAIL_KD }}
          EMAIL_KD_PASS: ${{ secrets.EMAIL_KD_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
        run: python scripts/rtaData_pipeline.py

  nav-job:
    runs-on: ubuntu-latest
    needs: rta-pipeline
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements_amfiPipe.txt

      - name: Run NAV Job
        run: python scripts/amfi_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
