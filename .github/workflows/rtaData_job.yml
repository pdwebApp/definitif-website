name: RTA Pipeline

on:
  # schedule:
  #   - cron: '20 3 * * *'   # 08:50 IST = 03:20 UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas numpy pyzipper beautifulsoup4 requests openpyxl xlrd

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_ID: ${{ secrets.EMAIL_KD }}
          EMAIL_PASS: ${{ secrets.EMAIL_KD_PASS }}
        run: |
          python scripts/rtaData_pipeline.py