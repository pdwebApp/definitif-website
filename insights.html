<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights - définitif investments</title>
  <link rel="icon" type="image/png" href="definitif_Logo_wb_with_red_hl_square.png">
  <link rel="stylesheet" href="style.css">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>

<body>

  <!-- Header (same as home) -->
  <header id="header"></header>

  <!-- Banner -->
  <div class="banner">
    <h1>Insights</h1>
  </div>

  <!-- Insights Content -->
  <div class="container">
    <section>
      <h2>Market Trends</h2>
      <p>Latest analysis and commentary on financial markets.</p>
    </section>

    <section>
      <h2>Investment Strategies</h2>
      <p>Guides and insights on building long-term wealth.</p>
    </section>
  </div>

  <!-- Footer (same as home) -->
  <footer id="footer"></footer>

</body>
</html>
