<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>définitif investments</title>
  <link rel="icon" type="image/png" href="definitif_Logo_wb_with_red_hl_square.png">
  <link rel="stylesheet" href="style.css">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>

<body>

  <!-- Header -->
  <header id="header"></header>

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Banner Section -->
  <div class="banner">
    <h1>"Clarity . Security . Growth"</h1>
  </div>

  <!-- Horizontal Sections -->
  <div class="horizontal-sections">
    <section id="insights" class="container">
      <h2>Products</h2>
      <p>Share your latest updates or articles here.</p>
      <img src="https://picsum.photos/300/200?random=1" alt="Random placeholder image">
    </section>

    <section id="about" class="container">
      <h2>Insights</h2>
      <p>Brief description about your company or project.</p>
      <img src="https://picsum.photos/300/200?random=2" alt="Random placeholder image">
    </section>

    <section class="container">
      <h2>About Us</h2>
      <p>Use this space for services, news, or highlights.</p>
      <img src="https://picsum.photos/300/200?random=3" alt="Random placeholder image">
    </section>
  </div>

  <!-- Footer -->
  <footer id="footer"></footer>

  <!-- JavaScript -->
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    const overlay = document.querySelector('.overlay');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');   // slide menu
      overlay.classList.toggle('active');    // show overlay
    });

    overlay.addEventListener('click', () => {
      navLinks.classList.remove('active');
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
