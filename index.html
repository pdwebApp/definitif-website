<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>définitif</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="container header-container">
    <img src="definitif_logo_wb_v2_red.png" class="logo" alt="Logo" />

    <nav class="nav-links">
      <a href="#about">About Us</a>
      <a href="#products">Products</a>
      <a href="#insights">Insights</a>
      <a href="#">Login</a>
    </nav>

    <div class="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</header>

<div class="overlay"></div>

<section class="banner">
  <h1>"Your inspiring quote goes here"</h1>
</section>

<div class="horizontal-sections">
  <section id="insights">
    <h2>Insights</h2>
    <p>Share your latest updates or articles here.</p>
  </section>

  <section id="about">
    <h2>About Us</h2>
    <p>Brief description about your company.</p>
  </section>

  <section>
    <h2>Additional Info</h2>
    <p>Services, news, or highlights.</p>
  </section>
</div>

<div class="section-dots">
  <span class="dot active"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>

<footer>
  <p>© définitif</p>
</footer>

<script>
  const toggle = document.querySelector(".menu-toggle");
  const nav = document.querySelector(".nav-links");
  const overlay = document.querySelector(".overlay");
  const header = document.querySelector("header");
  const sections = document.querySelector(".horizontal-sections");
  const dots = document.querySelectorAll(".dot");

  toggle.onclick = () => {
    nav.classList.toggle("active");
    overlay.classList.toggle("active");
  };

  overlay.onclick = () => {
    nav.classList.remove("active");
    overlay.classList.remove("active");
  };

  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    if (window.scrollY > lastY && window.scrollY > 100) {
      header.classList.add("hide");
    } else {
      header.classList.remove("hide");
    }
    lastY = window.scrollY;
  });

  sections.addEventListener("scroll", () => {
    const index = Math.round(
      sections.scrollLeft / sections.offsetWidth
    );
    dots.forEach(d => d.classList.remove("active"));
    dots[index]?.classList.add("active");
  });
</script>

</body>
</html>
