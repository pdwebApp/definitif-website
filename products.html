<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - définitif investments</title>
  <link rel="stylesheet" href="style.css">
</head>

<script>
  async function loadComponent(id, file) {
    const response = await fetch(file);
    const html = await response.text();
    document.getElementById(id).innerHTML = html;
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>

<body>

  <!-- Header (same as home) -->
  <header id="header"></header>
  <!-- Hamburger Toggle Overlay within Header -->
  <div class="overlay"></div>

  <!-- Banner -->
  <div class="banner">
    <h1>Our Products</h1>
  </div>

  <!-- Product Descriptions -->
  <div class="container">
    <section>
      <h2>Product A</h2>
      <p>Detailed description of Product A goes here.</p>
    </section>

    <section>
      <h2>Product B</h2>
      <p>Detailed description of Product B goes here.</p>
    </section>

    <section>
      <h2>Product C</h2>
      <p>Detailed description of Product C goes here.</p>
    </section>
  </div>

  <!-- Footer (same as home) -->
  <footer id="footer"></footer>

</body>
</html>
